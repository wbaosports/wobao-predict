<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOBAO 足球竞猜</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0f14;--card:#151b23;--card2:#1d2530;--text:#fff;--hint:#8b95a5;--green:#22c55e;--gold:#f5b301;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 14px 90px;user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:18px;font-weight:800}
.sponsor{font-size:12px;color:var(--hint);margin-top:2px}
.pts{text-align:right}.pts small{font-size:11px;color:var(--hint);display:block}.pts b{font-size:22px;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px}.stat small{font-size:11px;color:var(--hint)}
.prize{background:linear-gradient(90deg,rgba(245,179,1,.22),rgba(245,179,1,.06));color:var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f14ee;backdrop-filter:blur(10px);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #1f2733;z-index:10}
.nav button{flex:1;background:none;border:none;color:var(--hint);font-size:12px;padding:6px 0;font-weight:600}
.nav button span{display:block;font-size:20px;margin-bottom:2px}
.nav button.on{color:var(--green)}
.page{display:none}.page.on{display:block}
.sec{font-size:13px;color:var(--hint);margin:14px 2px 8px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.comp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--hint);margin-bottom:10px}
.comp img{width:14px;height:14px;object-fit:contain}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{text-align:center;font-size:13px;font-weight:700}
.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 6px}
.mid{text-align:center;min-width:70px}
.mid .t{font-size:12px;color:var(--hint)}
.mid .sc{font-size:24px;font-weight:800}
.live{color:var(--red);font-size:11px;font-weight:700;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.opts button{padding:11px 4px;border-radius:10px;border:1.5px solid transparent;background:var(--card2);color:var(--text);font-size:14px;font-weight:600}
.opts button.sel{border-color:var(--green);background:rgba(34,197,94,.18)}
.opts button:disabled{opacity:.45}
.exact{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:12px;color:var(--hint)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border-radius:8px;border:none;background:var(--card2);color:#fff;font-size:16px}
.step b{min-width:16px;text-align:center;color:#fff;font-size:16px}
.res{margin-top:10px;font-size:13px;font-weight:600;text-align:center}
.win{color:var(--green)}.lose{color:var(--hint)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border-radius:999px;border:none;background:var(--card);color:var(--hint);font-size:12px;font-weight:700}
.chips button.on{background:var(--green);color:#04210f}
.empty{text-align:center;color:var(--hint);font-size:14px;padding:30px 10px;line-height:1.6}
.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #222b37;font-size:14px}
.row:first-child{border-top:none}.me{color:var(--green);font-weight:800}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--green);color:#04210f;font-size:16px;font-weight:800}
.hint{font-size:12px;color:var(--hint);text-align:center;margin-top:10px;line-height:1.5}
/* penalty */
.pitch{position:relative;height:330px;border-radius:16px;overflow:hidden;background:linear-gradient(#0f3d24,#14532d 55%,#166534);margin-bottom:10px}
.goal{position:absolute;left:8%;right:8%;top:28px;height:150px;border:5px solid #fff;border-bottom:none;border-radius:4px 4px 0 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 16px),repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 2px,transparent 2px 16px)}
.zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.zones div{border:1px dashed rgba(255,255,255,.12)}
.zones div:active{background:rgba(255,255,255,.12)}
.keeper{position:absolute;left:50%;bottom:0;width:46px;height:78px;margin-left:-23px;transition:transform .35s cubic-bezier(.2,.8,.3,1);font-size:46px;line-height:78px;text-align:center}
.ball{position:absolute;left:50%;top:270px;width:30px;height:30px;margin-left:-15px;font-size:30px;line-height:30px;transition:transform .45s cubic-bezier(.15,.7,.3,1);z-index:3}
.flash{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:34px;font-weight:900;opacity:0;transform:scale(.6);transition:all .25s;z-index:4;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.flash.show{opacity:1;transform:scale(1)}
.kicks{display:flex;justify-content:center;gap:8px;margin:8px 0 4px}
.kicks i{width:14px;height:14px;border-radius:50%;background:#2a3442;display:block}
.kicks i.g{background:var(--green)}.kicks i.m{background:var(--red)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);background:#111;border:1px solid #2a3442;padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .3s;z-index:20;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top">
  <div><div class="brand">⚽ WOBAO 足球竞猜</div><div class="sponsor" id="sponsor"></div></div>
  <div class="pts"><small>我的积分</small><b id="pts">0</b></div>
</div>
<div class="stats">
  <div class="stat"><b id="sStreak">0</b><small>🔥 连胜</small></div>
  <div class="stat"><b id="sHit">0</b><small>✅ 猜中</small></div>
  <div class="stat"><b id="sExact">0</b><small>🎯 猜中比分</small></div>
</div>
<div class="prize" id="prize"></div>

<div class="page on" id="pMatch">
  <div id="matchList"><div class="empty">正在加载今日真实赛程…</div></div>
  <div class="hint">猜胜负 +300 · 猜中准确比分再 +700 · 连胜每场多 +100<br>免费参与，不涉及真钱</div>
</div>

<div class="page" id="pPen">
  <div class="card" style="text-align:center;padding:10px">
    <div style="font-weight:800">🥅 每日点球大战</div>
    <div style="font-size:12px;color:var(--hint);margin-top:4px">点球门任一位置射门 · 每天 5 球 · 进一球 +50 · 5 球全进再 +250</div>
    <div class="kicks" id="kicks"></div>
  </div>
  <div class="pitch" id="pitch">
    <div class="goal" id="goal">
      <div class="zones" id="zones">
        <div data-z="0"></div><div data-z="1"></div><div data-z="2"></div>
        <div data-z="3"></div><div data-z="4"></div><div data-z="5"></div>
      </div>
      <div class="keeper" id="keeper">🧤</div>
    </div>
    <div class="ball" id="ball">⚽</div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="hint" id="penHint"></div>
</div>

<div class="page" id="pBoard">
  <div class="card" id="board"></div>
  <button class="btn" id="invite">📣 邀请好友 +100 积分</button>
  <div class="hint">每周一结算，第一名获得本周大奖</div>
</div>

<div class="nav">
  <button class="on" data-p="pMatch"><span>⚽</span>竞猜</button>
  <button data-p="pPen"><span>🥅</span>点球大战</button>
  <button data-p="pBoard"><span>🏆</span>排行榜</button>
</div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  sponsor: "赞助品牌",
  prize: "🏆 本周第一名：签名球衣 + 球员见面会",
  botUsername: "wobao_predict_bot"
};

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0b0f14"); tg.setBackgroundColor("#0b0f14"); } catch (e) {} }
const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || { first_name: "你" };
const KEY = "wobao_v2";
const today = () => new Date().toISOString().slice(0, 10);

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S) S = { picks: {}, earned: 1000, streak: 0, hits: 0, exact: 0, invited: false, pen: { date: "", shots: [] } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const haptic = t => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
const notify = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200);
}

function renderTop() {
  document.getElementById("pts").textContent = S.earned.toLocaleString();
  document.getElementById("sStreak").textContent = S.streak;
  document.getElementById("sHit").textContent = S.hits;
  document.getElementById("sExact").textContent = S.exact;
  document.getElementById("sponsor").textContent = "由 " + CONFIG.sponsor + " 独家赞助";
  document.getElementById("prize").textContent = CONFIG.prize;
}

/* ---------- 竞猜：真实赛程 ---------- */
let MATCHES = [];
let FILTER = "全部";
const LABEL = ["主胜", "平局", "客胜"];
const isLive = s => s === "IN_PLAY" || s === "PAUSED";
const outcome = (h, a) => h > a ? 0 : h === a ? 1 : 2;

function timeLabel(utc) {
  const d = new Date(utc), n = new Date();
  const dd = Math.round((new Date(d.toDateString()) - new Date(n.toDateString())) / 864e5);
  const hm = d.toTimeString().slice(0, 5);
  return (dd === 0 ? "今天 " : dd === 1 ? "明天 " : dd === -1 ? "昨天 " : (d.getMonth() + 1) + "/" + d.getDate() + " ") + hm;
}

function settle() {
  let changed = false;
  for (const m of MATCHES) {
    const p = S.picks[m.id];
    if (!p || p.done || m.status !== "FINISHED" || m.hs === null) continue;
    const ok = p.o === outcome(m.hs, m.as);
    const ex = ok && p.h === m.hs && p.a === m.as;
    let gain = 0;
    if (ok) { S.streak += 1; S.hits += 1; gain = 300 + (S.streak - 1) * 100; if (ex) { gain += 700; S.exact += 1; } }
    else S.streak = 0;
    p.done = true; p.gain = gain; S.earned += gain; changed = true;
    if (gain) toast((ex ? "🎯 猜中比分！" : "✅ 猜中！") + m.home + " vs " + m.away + " +" + gain);
  }
  if (changed) { save(); renderTop(); }
}

function teamHTML(name, logo) {
  return `<div class="team">${logo ? `<img src="${logo}" alt="" onerror="this.style.visibility='hidden'">` : ""}${name}</div>`;
}

function matchCard(m) {
  const p = S.picks[m.id] || null;
  const started = m.status !== "SCHEDULED" && m.status !== "TIMED";
  const locked = started || new Date(m.utc) <= new Date();
  let mid;
  if (isLive(m.status)) mid = `<div class="live">● ${m.clock || "进行中"}</div><div class="sc">${m.hs ?? 0} : ${m.as ?? 0}</div>`;
  else if (m.status === "FINISHED") mid = `<div class="t">完场</div><div class="sc">${m.hs} : ${m.as}</div>`;
  else mid = `<div class="t">${timeLabel(m.utc)}</div><div class="sc" style="font-size:16px;color:var(--hint)">VS</div>`;
  let html = `<div class="comp">${m.compLogo ? `<img src="${m.compLogo}" alt="">` : ""}${m.comp}</div>
    <div class="teams">${teamHTML(m.home, m.homeLogo)}<div class="mid">${mid}</div>${teamHTML(m.away, m.awayLogo)}</div>
    <div class="opts">${LABEL.map((t, i) => `<button data-id="${m.id}" data-o="${i}" class="${p && p.o === i ? "sel" : ""}" ${locked ? "disabled" : ""}>${t}</button>`).join("")}</div>`;
  if (p && !locked) {
    html += `<div class="exact">猜比分（可选）
      <div class="step"><button data-id="${m.id}" data-s="h" data-d="-1">−</button><b>${p.h ?? "-"}</b><button data-id="${m.id}" data-s="h" data-d="1">+</button></div>:
      <div class="step"><button data-id="${m.id}" data-s="a" data-d="-1">−</button><b>${p.a ?? "-"}</b><button data-id="${m.id}" data-s="a" data-d="1">+</button></div></div>`;
  }
  if (p && p.done) html += `<div class="res ${p.gain ? "win" : "lose"}">${p.gain ? "猜中 +" + p.gain : "未猜中"}</div>`;
  else if (p && locked) html += `<div class="res lose">已锁定：${LABEL[p.o]}${p.h != null && p.a != null ? "，比分 " + p.h + ":" + p.a : ""}</div>`;
  return `<div class="card">${html}</div>`;
}

function renderMatches() {
  const box = document.getElementById("matchList");
  if (!MATCHES.length) { box.innerHTML = `<div class="empty">接下来几天暂时没有赛事<br>先去玩「点球大战」吧 🥅</div>`; return; }
  const comps = [...new Set(MATCHES.map(m => m.comp))];
  if (FILTER !== "全部" && !comps.includes(FILTER)) FILTER = "全部";
  const list = FILTER === "全部" ? MATCHES : MATCHES.filter(m => m.comp === FILTER);
  const live = list.filter(m => isLive(m.status));
  const up = list.filter(m => m.status === "SCHEDULED" || m.status === "TIMED").sort((a, b) => a.utc.localeCompare(b.utc));
  const done = list.filter(m => m.status === "FINISHED").sort((a, b) => b.utc.localeCompare(a.utc)).slice(0, 8);
  let html = `<div class="chips">${["全部", ...comps].map(c => `<button data-c="${c}" class="${c === FILTER ? "on" : ""}">${c}</button>`).join("")}</div>`;
  if (live.length) html += `<div class="sec">🔴 进行中</div>` + live.map(matchCard).join("");
  if (up.length) html += `<div class="sec">📅 即将开赛</div>` + up.slice(0, 20).map(matchCard).join("");
  if (done.length) html += `<div class="sec">✅ 最近完场</div>` + done.map(matchCard).join("");
  box.innerHTML = html;
  box.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => { FILTER = b.dataset.c; haptic(); renderMatches(); });
  box.querySelectorAll("button[data-o]").forEach(b => b.onclick = () => {
    const id = b.dataset.id, cur = S.picks[id] || {};
    S.picks[id] = { o: Number(b.dataset.o), h: cur.h ?? null, a: cur.a ?? null };
    save(); haptic(); renderMatches();
  });
  box.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => {
    const p = S.picks[b.dataset.id]; const k = b.dataset.s;
    p[k] = Math.max(0, Math.min(9, (p[k] ?? 0) + Number(b.dataset.d)));
    if (p.h != null && p.a != null) p.o = outcome(p.h, p.a);
    save(); haptic(); renderMatches();
  });
}

async function loadMatches() {
  try {
    const r = await fetch("/api/matches");
    const d = await r.json();
    if (!r.ok) throw new Error("net");
    MATCHES = d.matches || [];
    settle(); renderMatches();
  } catch (e) {
    if (!MATCHES.length) document.getElementById("matchList").innerHTML = `<div class="empty">赛程加载失败，请稍后再打开</div>`;
  }
}

/* ---------- 点球大战 ---------- */
const ZONE_X = [-1, 0, 1, -1, 0, 1], ZONE_Y = [0, 0, 0, 1, 1, 1];
let busy = false;

function penState() { if (S.pen.date !== today()) { S.pen = { date: today(), shots: [] }; save(); } return S.pen; }

function renderPen() {
  const p = penState();
  document.getElementById("kicks").innerHTML = [0, 1, 2, 3, 4].map(i => `<i class="${p.shots[i] === true ? "g" : p.shots[i] === false ? "m" : ""}"></i>`).join("");
  const left = 5 - p.shots.length, goals = p.shots.filter(Boolean).length;
  document.getElementById("penHint").textContent = left > 0 ? `今天还剩 ${left} 球 · 已进 ${goals} 球` : `今天 5 球已踢完（进 ${goals} 球），明天再来！`;
}

function shoot(z) {
  const p = penState();
  if (busy || p.shots.length >= 5) { if (p.shots.length >= 5) toast("今天的 5 球踢完了，明天再来 ⚽"); return; }
  busy = true; haptic("medium");
  const goalEl = document.getElementById("goal"), pitch = document.getElementById("pitch");
  const gw = goalEl.clientWidth, gh = goalEl.clientHeight;
  const gx = goalEl.offsetLeft + gw / 2, gy = goalEl.offsetTop;
  const tx = gx + ZONE_X[z] * gw / 3 - pitch.clientWidth / 2;
  const ty = gy + (ZONE_Y[z] === 0 ? gh * 0.28 : gh * 0.75) - 285;
  const kz = Math.floor(Math.random() * 6);
  const keeper = document.getElementById("keeper"), ball = document.getElementById("ball");
  keeper.style.transform = `translate(${ZONE_X[kz] * gw / 3}px, ${ZONE_Y[kz] === 0 ? -gh * 0.35 : 0}px) rotate(${ZONE_X[kz] * 70}deg)`;
  ball.style.transform = `translate(${tx}px, ${ty}px) scale(.65)`;
  const saved = ZONE_X[kz] === ZONE_X[z] && (ZONE_Y[kz] === ZONE_Y[z] || ZONE_X[z] === 0);
  setTimeout(() => {
    const flash = document.getElementById("flash");
    flash.textContent = saved ? "🧤 被扑出！" : "⚽ GOAL!";
    flash.style.color = saved ? "#fca5a5" : "#86efac";
    flash.classList.add("show");
    p.shots.push(!saved);
    if (!saved) { S.earned += 50; notify("success"); } else notify("error");
    if (p.shots.length === 5 && p.shots.every(Boolean)) { S.earned += 250; setTimeout(() => toast("🔥 5 球全进！额外 +250"), 600); }
    save(); renderTop(); renderPen(); renderBoard();
    setTimeout(() => {
      flash.classList.remove("show");
      keeper.style.transform = ""; ball.style.transform = "";
      busy = false;
    }, 1100);
  }, 480);
}
document.querySelectorAll("#zones div").forEach(d => d.onclick = () => shoot(Number(d.dataset.z)));

/* ---------- 排行榜 ---------- */
function renderBoard() {
  const list = [["Ahmad", 4820], ["小龙", 4150], ["Siti", 3400], ["Jason", 2910], ["Kumar", 2350], [user.first_name, S.earned, true]].sort((a, b) => b[1] - a[1]);
  document.getElementById("board").innerHTML = list.map((r, i) =>
    `<div class="row"><span class="${r[2] ? "me" : ""}">${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${r[0]}</span><span class="${r[2] ? "me" : ""}">${r[1].toLocaleString()}</span></div>`).join("");
}
document.getElementById("invite").onclick = () => {
  const link = "https://t.me/" + CONFIG.botUsername + "?start=ref_" + (user.id || "0");
  const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent("一起来猜球、踢点球，赢签名球衣！⚽");
  if (tg) tg.openTelegramLink(url); else window.open(url);
  if (!S.invited) { S.invited = true; S.earned += 100; save(); renderTop(); renderBoard(); }
};

/* ---------- 导航 ---------- */
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === b.dataset.p));
  haptic(); window.scrollTo(0, 0);
});

renderTop(); renderPen(); renderBoard(); loadMatches();
setInterval(loadMatches, 60000);
</script>
</body>
</html>
